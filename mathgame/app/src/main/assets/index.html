<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Toán Tốc Chiến</title>
<style>
  :root{
    --bg1:#312e81; --bg2:#1b1748;
    --ink:#0f172a; --ink-soft:#475569;
    --gold:#fbbf24; --gold-deep:#f59e0b;
    --go:#22c55e; --go-deep:#16a34a;
    --stop:#ef4444; --stop-deep:#dc2626;
    --amber:#f59e0b; --amber-deep:#d97706;
    --sky:#38bdf8; --grape:#a855f7; --coral:#fb7185;
    --card:#ffffff; --lav:#eef2ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI Rounded','SF Pro Rounded',system-ui,-apple-system,'Roboto',sans-serif;
    color:#fff;
    background:radial-gradient(120% 90% at 50% -10%, #4338ca 0%, var(--bg1) 45%, var(--bg2) 100%);
    background-attachment:fixed;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    height:100dvh; height:100vh;
    display:flex; flex-direction:column;
    max-width:640px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  .screen{flex:1; display:none; flex-direction:column; min-height:0;}
  .screen.on{display:flex;}

  /* ---------- HOME ---------- */
  .home-top{text-align:center; padding:4px 0 2px;}
  .logo{
    font-size:clamp(30px,8vw,50px); font-weight:900; letter-spacing:.5px; line-height:1.02;
    text-shadow:0 4px 0 rgba(0,0,0,.18), 0 0 26px rgba(129,140,248,.55);
  }
  .logo .a{color:var(--gold);}
  .tagline{margin-top:6px; font-size:clamp(12.5px,3.4vw,15px); color:#c7d2fe; font-weight:600;}
  .home-mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:8px 0; overflow-y:auto; min-height:0;}
  .module{display:flex; flex-direction:column; gap:9px;}
  .sec-title{display:flex; align-items:center; gap:9px; font-size:clamp(16px,4.4vw,20px); font-weight:900; color:#e0e7ff; padding-left:4px;}
  .sec-title .ico{font-size:1.15em; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}

  /* nút chọn độ khó cộng/trừ */
  .diff-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    border:none; border-radius:20px; padding:12px 13px; color:#fff;
    background:rgba(255,255,255,.08);
    box-shadow:0 6px 0 rgba(0,0,0,.16), 0 8px 18px rgba(0,0,0,.22);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .diff-btn:active{transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,.16);}
  .d-pill{min-width:96px; text-align:center; font-weight:900; font-size:clamp(15px,4vw,18px); padding:11px 8px; border-radius:15px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
  .d-easy   .d-pill{background:linear-gradient(135deg,#4ade80,#16a34a); color:#052e13;}
  .d-medium .d-pill{background:linear-gradient(135deg,#fbbf24,#d97706); color:#3a2606;}
  .d-hard   .d-pill{background:linear-gradient(135deg,#fb7185,#dc2626); color:#3f0a0a;}
  .d-mid{flex:1; min-width:0;}
  .d-desc{font-weight:800; font-size:clamp(13px,3.6vw,15px);}
  .d-rec{font-size:12px; color:#fcd34d; font-weight:800; margin-top:3px; min-height:14px;}
  .d-time{font-weight:900; font-size:13px; background:rgba(0,0,0,.26); padding:9px 11px; border-radius:13px; white-space:nowrap;}

  /* thẻ lớn cho bảng cửu chương */
  .level-btn{
    border:none; border-radius:22px; padding:16px 18px; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:16px; color:#fff; width:100%;
    background:linear-gradient(135deg,#ea580c,#f59e0b);
    box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 26px rgba(0,0,0,.26);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .level-btn:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .lvl-emoji{font-size:clamp(34px,9vw,46px); filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
  .lvl-txt{flex:1; min-width:0;}
  .lvl-name{font-size:clamp(17px,4.6vw,22px); font-weight:900;}
  .lvl-desc{font-size:clamp(12px,3.3vw,14px); opacity:.95; margin-top:2px; font-weight:700;}
  .lvl-best{font-size:12px; margin-top:5px; font-weight:800; color:#fffbe6;}

  .home-bottom{display:flex; gap:12px; padding-top:2px;}
  .ghost{
    flex:1; border:2px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06);
    color:#e0e7ff; border-radius:16px; padding:13px; font-size:15px; font-weight:800; cursor:pointer;
  }
  .ghost:active{background:rgba(255,255,255,.14);}

  /* ---------- GAME ---------- */
  .hud{display:flex; align-items:center; gap:10px; padding:2px 2px 8px;}
  .chip{
    display:flex; align-items:center; gap:7px; font-weight:900;
    background:rgba(255,255,255,.12); border-radius:16px; padding:9px 13px; font-size:15px;
  }
  .chip.score{background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#3a2606;}
  .chip .lbl{font-size:11px; opacity:.85; font-weight:800;}
  .hud .spacer{flex:1;}
  .quit{
    border:none; background:rgba(255,255,255,.12); color:#fff; width:42px; height:42px;
    border-radius:14px; font-size:18px; font-weight:900; cursor:pointer;
  }
  .quit:active{background:rgba(255,255,255,.22);}
  .mode-name{text-align:center; font-size:13px; font-weight:800; color:#c7d2fe; margin:0 0 8px;}

  .timer-wrap{margin:2px 2px 16px;}
  .timer-track{height:20px; border-radius:14px; background:rgba(0,0,0,.28); overflow:hidden; box-shadow:inset 0 2px 6px rgba(0,0,0,.35);}
  .timer-fill{height:100%; width:100%; border-radius:14px; background:var(--go); transition:background-color .2s linear;}
  .timer-num{text-align:center; margin-top:7px; font-weight:900; font-size:15px; color:#e0e7ff;}

  .q-area{flex:1; display:flex; align-items:center; justify-content:center; min-height:0;}
  .q-card{
    background:var(--card); color:var(--ink); border-radius:30px; width:100%;
    padding:26px 18px; text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,.35);
  }
  .q-index{font-size:14px; font-weight:800; color:var(--ink-soft); letter-spacing:.4px;}
  .q-text{font-size:clamp(44px,14vw,80px); font-weight:900; line-height:1.05; margin-top:8px; letter-spacing:1px;}
  .q-text .eq{color:#94a3b8;}

  .opts{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
  .opt{
    border:none; border-radius:22px; padding:22px 10px; cursor:pointer;
    font-size:clamp(26px,8vw,40px); font-weight:900; color:var(--ink);
    background:var(--lav); box-shadow:0 7px 0 #c7d2fe;
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .opt:active{transform:translateY(4px); box-shadow:0 3px 0 #c7d2fe;}
  .opt.correct{background:linear-gradient(135deg,var(--go),var(--go-deep)); color:#fff; box-shadow:0 7px 0 #0f7a37; animation:pop .35s ease;}
  .opt.wrong{background:linear-gradient(135deg,var(--stop),var(--stop-deep)); color:#fff; box-shadow:0 7px 0 #991b1b; animation:shake .4s ease;}
  .opt.dim{opacity:.45;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .flash{position:fixed; inset:0; pointer-events:none; opacity:0; z-index:5; transition:opacity .18s ease;}
  .flash.show{opacity:1;}
  .flash.good{background:radial-gradient(circle at 50% 45%, rgba(34,197,94,.35), transparent 60%);}
  .flash.bad{background:radial-gradient(circle at 50% 45%, rgba(239,68,68,.4), transparent 62%);}

  /* ---------- GAME OVER ---------- */
  .over-box{flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; gap:6px;}
  .over-emoji{font-size:clamp(56px,18vw,96px); line-height:1;}
  .over-title{font-size:clamp(24px,6.5vw,36px); font-weight:900;}
  .over-reason{font-size:15px; color:#c7d2fe; font-weight:700; margin-top:2px;}
  .score-big{
    margin:16px auto; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#3a2606;
    border-radius:26px; padding:16px 30px; display:inline-block; box-shadow:0 12px 26px rgba(0,0,0,.3);
  }
  .score-big .n{font-size:clamp(48px,16vw,80px); font-weight:900; line-height:1;}
  .score-big .l{font-size:14px; font-weight:800; opacity:.85;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0 4px;}
  .stat{background:rgba(255,255,255,.1); border-radius:16px; padding:12px 6px;}
  .stat .v{font-size:24px; font-weight:900;}
  .stat .k{font-size:11.5px; opacity:.85; font-weight:700; margin-top:2px;}
  .over-actions{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .btn-primary{
    border:none; border-radius:22px; padding:18px; font-size:18px; font-weight:900; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,var(--go),var(--go-deep)); box-shadow:0 8px 0 #0f7a37;
  }
  .btn-primary:active{transform:translateY(5px); box-shadow:0 3px 0 #0f7a37;}

  /* ---------- HISTORY ---------- */
  .h-head{display:flex; align-items:center; gap:12px; padding:2px 0 14px;}
  .h-head .title{font-size:24px; font-weight:900; flex:1;}
  .back{border:none; background:rgba(255,255,255,.12); color:#fff; width:44px; height:44px; border-radius:14px; font-size:20px; font-weight:900; cursor:pointer;}
  .back:active{background:rgba(255,255,255,.22);}
  .h-list{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px; min-height:0;}
  .h-item{background:rgba(255,255,255,.09); border-radius:18px; padding:13px 15px; margin-bottom:10px; display:flex; align-items:center; gap:13px;}
  .h-badge{font-size:24px;}
  .h-mid{flex:1; min-width:0;}
  .h-when{font-size:13px; color:#c7d2fe; font-weight:700;}
  .h-sub{font-size:12.5px; color:#a5b4fc; margin-top:3px; font-weight:600;}
  .h-score{font-size:26px; font-weight:900; text-align:right;}
  .h-score.pos{color:var(--go);} .h-score.neg{color:var(--coral);} .h-score.zero{color:#e2e8f0;}
  .h-empty{text-align:center; color:#c7d2fe; margin-top:40px; font-size:16px; font-weight:600; line-height:1.6;}
  .h-clear{border:2px solid rgba(251,113,133,.45); background:rgba(251,113,133,.1); color:#fecdd3;
    border-radius:16px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; margin-top:6px;}
  .h-clear:active{background:rgba(251,113,133,.22);}

  @media (prefers-reduced-motion: reduce){
    .opt.correct,.opt.wrong{animation:none;}
    .diff-btn,.level-btn,.opt,.btn-primary{transition:none;}
  }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div id="app">

  <!-- HOME -->
  <section class="screen on" id="screen-home">
    <div class="home-top">
      <div class="logo">TOÁN <span class="a">TỐC CHIẾN</span></div>
      <div class="tagline">Tính nhanh · Đúng cộng điểm · Sai trừ điểm</div>
    </div>

    <div class="home-mid">
      <div class="module">
        <div class="sec-title"><span class="ico">➕➖</span> Cộng &amp; Trừ</div>

        <button class="diff-btn d-easy" onclick="Game.start('add_easy')">
          <span class="d-pill">Dễ</span>
          <span class="d-mid">
            <div class="d-desc">Cộng trừ số 1 chữ số</div>
            <div class="d-rec" id="rec-add_easy"></div>
          </span>
          <span class="d-time">5 giây</span>
        </button>

        <button class="diff-btn d-medium" onclick="Game.start('add_medium')">
          <span class="d-pill">Vừa</span>
          <span class="d-mid">
            <div class="d-desc">2 chữ số ± 1 chữ số</div>
            <div class="d-rec" id="rec-add_medium"></div>
          </span>
          <span class="d-time">20 giây</span>
        </button>

        <button class="diff-btn d-hard" onclick="Game.start('add_hard')">
          <span class="d-pill">Khó</span>
          <span class="d-mid">
            <div class="d-desc">Các số nhỏ hơn 100</div>
            <div class="d-rec" id="rec-add_hard"></div>
          </span>
          <span class="d-time">30 giây</span>
        </button>
      </div>

      <div class="module">
        <div class="sec-title"><span class="ico">✖️</span> Bảng cửu chương</div>
        <button class="level-btn" onclick="Game.start('mul')">
          <div class="lvl-emoji">✖️</div>
          <div class="lvl-txt">
            <div class="lvl-name">Phép nhân 2–9</div>
            <div class="lvl-desc">300 câu ngẫu nhiên · 5 giây / câu</div>
            <div class="lvl-best" id="rec-mul"></div>
          </div>
        </button>
      </div>
    </div>

    <div class="home-bottom">
      <button class="ghost" onclick="History.open()">📜 Lịch sử điểm</button>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="chip score"><span class="lbl">ĐIỂM</span><span id="hud-score">0</span></div>
      <div class="chip"><span class="lbl">CÂU</span><span id="hud-count">1/300</span></div>
      <div class="spacer"></div>
      <button class="quit" onclick="Game.confirmQuit()" title="Thoát">✕</button>
    </div>
    <div class="mode-name" id="mode-name">—</div>

    <div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="timer-num" id="timer-num">5.0 giây</div>
    </div>

    <div class="q-area">
      <div class="q-card">
        <div class="q-index" id="q-index">Câu 1</div>
        <div class="q-text" id="q-text">—</div>
        <div class="opts" id="opts"></div>
      </div>
    </div>
  </section>

  <!-- GAME OVER -->
  <section class="screen" id="screen-over">
    <div class="over-box">
      <div class="over-emoji" id="over-emoji">🏆</div>
      <div class="over-title" id="over-title">Kết thúc!</div>
      <div class="over-reason" id="over-reason"></div>
      <div class="score-big"><div class="n" id="over-score">0</div><div class="l">TỔNG ĐIỂM</div></div>
      <div class="stats">
        <div class="stat"><div class="v" id="over-correct" style="color:var(--go)">0</div><div class="k">Đúng</div></div>
        <div class="stat"><div class="v" id="over-wrong" style="color:var(--coral)">0</div><div class="k">Sai</div></div>
        <div class="stat"><div class="v" id="over-answered">0</div><div class="k">Đã trả lời</div></div>
      </div>
      <div class="over-actions">
        <button class="btn-primary" onclick="Game.replay()">🔄 Chơi lại</button>
        <button class="ghost" onclick="Screen.go('home')">🏠 Về trang chủ</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="screen" id="screen-history">
    <div class="h-head">
      <button class="back" onclick="Screen.go('home')">‹</button>
      <div class="title">Lịch sử điểm</div>
    </div>
    <div class="h-list" id="h-list"></div>
    <button class="h-clear" id="h-clear" onclick="History.clear()">🗑️ Xóa toàn bộ lịch sử</button>
  </section>

</div>

<script>
"use strict";

/* ====== Cấu hình chung ====== */
const CONFIG = {
  QUESTIONS: 300,   // số câu mỗi phiên
  POINT_RIGHT: +1,  // đúng cộng
  POINT_WRONG: -1   // sai trừ
};
const LOG_KEY = 'ttc_logs_v1';

/* ====== Tiện ích ====== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

/* ====== Âm thanh (Web Audio – không cần file, chạy offline) ====== */
const Sound = (()=>{
  let ctx=null;
  function ensure(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function tone(freq,start,dur,type='sine',vol=0.22){
    if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    const t=ctx.currentTime+start;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
  }
  return {
    unlock: ensure,
    right(){ ensure(); tone(660,0,0.12,'sine',0.2); tone(990,0.09,0.16,'sine',0.2); },
    wrong(){ ensure(); tone(200,0,0.28,'sawtooth',0.28); tone(150,0.05,0.30,'square',0.18); },
    over(){ ensure(); tone(500,0,0.18,'sine',0.22); tone(380,0.16,0.20,'sine',0.22); tone(260,0.34,0.34,'sine',0.22); }
  };
})();

/* ====== Sinh 4 lựa chọn (đáp án + 3 nhiễu, không âm, không trùng) ====== */
function makeOptions(answer, pool){
  const set = new Set([answer]);
  const distractors = [];
  const cand = shuffle(pool.filter(v => Number.isInteger(v) && v>=0 && v!==answer));
  for(const v of cand){ if(distractors.length>=3) break; if(!set.has(v)){ set.add(v); distractors.push(v); } }
  let d=1;
  while(distractors.length<3){
    for(const v of [answer+d, answer-d]){
      if(distractors.length>=3) break;
      if(Number.isInteger(v) && v>=0 && !set.has(v)){ set.add(v); distractors.push(v); }
    }
    d++; if(d>50) break;
  }
  return shuffle([answer, ...distractors]);
}

/* ====== Bộ sinh câu hỏi cho từng chế độ ====== */
// Cấp Dễ: cộng/trừ 1 chữ số (1..9), trừ không âm
function genAddSubEasy(){
  let a,b,ans,op;
  if(Math.random()<0.5){ a=rint(1,9); b=rint(1,9); ans=a+b; op='+'; }
  else { a=rint(1,9); b=rint(0,a); ans=a-b; op='−'; }
  const pool=[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,a,b];
  return { text:`${a} ${op} ${b}`, answer:ans, options:makeOptions(ans, pool) };
}
// Cấp Vừa: 2 chữ số (10..99) ± 1 chữ số (1..9)
function genAddSubMedium(){
  let a,b,ans,op;
  if(Math.random()<0.5){ a=rint(10,99); b=rint(1,9); ans=a+b; op='+'; }
  else { a=rint(10,99); b=rint(1,9); ans=a-b; op='−'; }   // a>=10>9>=b => ans>=1
  const pool=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+b,ans-b,a];
  return { text:`${a} ${op} ${b}`, answer:ans, options:makeOptions(ans, pool) };
}
// Cấp Khó: các số nhỏ hơn 100 (1..99), trừ không âm
function genAddSubHard(){
  let a,b,ans,op;
  if(Math.random()<0.5){ a=rint(1,99); b=rint(1,99); ans=a+b; op='+'; }
  else { a=rint(1,99); b=rint(0,a); ans=a-b; op='−'; }
  const pool=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+9,ans+11,a,b];
  return { text:`${a} ${op} ${b}`, answer:ans, options:makeOptions(ans, pool) };
}
// Nhân: bảng cửu chương 2..9
function genMul(){
  const a=rint(2,9), b=rint(1,10), ans=a*b;
  const pool=[a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, ans+a, ans-a, ans+1, ans-1, ans+2, ans-2, ans+b, ans-b];
  return { text:`${a} × ${b}`, answer:ans, options:makeOptions(ans, pool) };
}

/* ====== Các chế độ chơi (đổi thời gian/số câu ở đây) ====== */
const MODES = {
  add_easy:   { name:'Cộng & Trừ · Dễ',         group:'addsub', badge:'➕', time:5,  gen:genAddSubEasy },
  add_medium: { name:'Cộng & Trừ · Vừa',        group:'addsub', badge:'➕', time:20, gen:genAddSubMedium },
  add_hard:   { name:'Cộng & Trừ · Khó',        group:'addsub', badge:'➕', time:30, gen:genAddSubHard },
  mul:        { name:'Bảng cửu chương (Nhân)',  group:'mul',    badge:'✖️', time:5,  gen:genMul }
};

function buildQuestions(modeKey){
  const gen = MODES[modeKey].gen;
  const out=[];
  for(let i=0;i<CONFIG.QUESTIONS;i++) out.push(gen());
  return out;
}

/* ====== Màn hình ====== */
const Screen = {
  go(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    $('screen-'+name).classList.add('on');
    if(name==='home') Home.refresh();
  }
};

/* ====== Lưu trữ log ====== */
const Store = {
  all(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(e){ return []; } },
  add(rec){ const a=this.all(); a.push(rec); try{ localStorage.setItem(LOG_KEY, JSON.stringify(a)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(LOG_KEY); }catch(e){} }
};

/* ====== Trang chủ: hiện kỷ lục từng chế độ ====== */
const Home = {
  refresh(){
    const logs = Store.all();
    for(const key of Object.keys(MODES)){
      const played = logs.filter(l=>l.mode===key);
      const el = $('rec-'+key);
      if(!el) continue;
      if(played.length){
        const best = Math.max(...played.map(l=>l.score));
        el.textContent = `⭐ Kỷ lục ${best} · đã chơi ${played.length} lần`;
      } else el.textContent = '';
    }
  }
};

/* ====== Game ====== */
const Game = {
  mode:'add_easy', timeLimit:5, questions:[], i:0, score:0, correct:0, wrong:0,
  locked:false, rafId:null, startedAt:0,

  start(modeKey){
    Sound.unlock();
    this.mode=modeKey;
    this.timeLimit=MODES[modeKey].time;
    this.questions=buildQuestions(modeKey);
    this.i=0; this.score=0; this.correct=0; this.wrong=0; this.locked=false;
    this.startedAt=Date.now();
    $('hud-score').textContent='0';
    $('mode-name').textContent=MODES[modeKey].name;
    Screen.go('game');
    this.show();
  },
  replay(){ this.start(this.mode); },

  show(){
    this.locked=false;
    const q=this.questions[this.i];
    $('q-index').textContent = `Câu ${this.i+1}`;
    $('hud-count').textContent = `${this.i+1}/${CONFIG.QUESTIONS}`;
    $('q-text').innerHTML = q.text.replace(/([+−×])/g, '<span class="eq">$1</span>');
    const box=$('opts'); box.innerHTML='';
    q.options.forEach(v=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=v;
      b.onclick=()=>this.answer(v,b);
      box.appendChild(b);
    });
    this.startTimer();
  },

  startTimer(){
    const fill=$('timer-fill'), num=$('timer-num');
    const total=this.timeLimit*1000, t0=performance.now();
    const step=(now)=>{
      const left=total-(now-t0);
      const f=Math.max(0,left/total);
      fill.style.width=(f*100)+'%';
      fill.style.background = f>0.5 ? 'var(--go)' : (f>0.25 ? 'var(--amber)' : 'var(--stop)');
      num.textContent=(Math.max(0,left)/1000).toFixed(1)+' giây';
      if(left<=0){ this.rafId=null; this.onTimeout(); return; }
      this.rafId=requestAnimationFrame(step);
    };
    this.stopTimer();
    this.rafId=requestAnimationFrame(step);
  },
  stopTimer(){ if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId=null; } },

  answer(val, btn){
    if(this.locked) return;
    this.locked=true; this.stopTimer();
    const q=this.questions[this.i];
    const buttons=[...document.querySelectorAll('#opts .opt')];
    buttons.forEach(b=>{ if(b!==btn) b.classList.add('dim'); });

    if(val===q.answer){
      this.score+=CONFIG.POINT_RIGHT; this.correct++;
      btn.classList.remove('dim'); btn.classList.add('correct');
      Sound.right(); Game.flash('good');
      $('hud-score').textContent=this.score;
      setTimeout(()=>this.next(), 650);
    }else{
      this.score+=CONFIG.POINT_WRONG; this.wrong++;
      btn.classList.remove('dim'); btn.classList.add('wrong');
      buttons.forEach(b=>{ if(Number(b.textContent)===q.answer){ b.classList.remove('dim'); b.classList.add('correct'); } });
      Sound.wrong(); Game.flash('bad');
      $('hud-score').textContent=this.score;
      setTimeout(()=>this.next(), 1350);
    }
  },

  next(){
    this.i++;
    if(this.i>=CONFIG.QUESTIONS){ this.end('completed'); return; }
    this.show();
  },

  onTimeout(){
    if(this.locked) return;
    this.locked=true;
    const q=this.questions[this.i];
    [...document.querySelectorAll('#opts .opt')].forEach(b=>{
      if(Number(b.textContent)===q.answer) b.classList.add('correct'); else b.classList.add('dim');
    });
    Sound.wrong();
    setTimeout(()=>this.end('timeout'), 1100);
  },

  end(reason){
    this.stopTimer();
    const m=MODES[this.mode];
    const rec={
      date:new Date().toISOString(),
      mode:this.mode, modeName:m.name, group:m.group, badge:m.badge, time:this.timeLimit,
      score:this.score, correct:this.correct, wrong:this.wrong,
      answered:this.correct+this.wrong, total:CONFIG.QUESTIONS,
      reason:reason, durationSec:Math.round((Date.now()-this.startedAt)/1000)
    };
    Store.add(rec);
    Sound.over();

    $('over-score').textContent=this.score;
    $('over-correct').textContent=this.correct;
    $('over-wrong').textContent=this.wrong;
    $('over-answered').textContent=this.correct+this.wrong;
    if(reason==='completed'){ $('over-emoji').textContent='🏆'; $('over-title').textContent='Hoàn thành 300 câu!'; $('over-reason').textContent='Bạn đã trả lời hết tất cả câu hỏi.'; }
    else if(reason==='quit'){ $('over-emoji').textContent='👋'; $('over-title').textContent='Đã thoát'; $('over-reason').textContent='Phiên chơi đã được ghi lại.'; }
    else { $('over-emoji').textContent='⏰'; $('over-title').textContent='Hết giờ!'; $('over-reason').textContent=`Bạn không trả lời kịp trong ${this.timeLimit} giây.`; }
    Screen.go('over');
  },

  confirmQuit(){
    this.stopTimer();
    if(confirm('Thoát phiên chơi? Điểm hiện tại sẽ được ghi lại.')){ this.end('quit'); }
    else { if(!this.locked) this.startTimer(); }
  },

  flash(kind){
    const f=$('flash'); f.className='flash '+(kind==='good'?'good':'bad')+' show';
    setTimeout(()=>f.classList.remove('show'), 200);
  }
};

/* ====== Lịch sử ====== */
const History = {
  open(){ this.render(); Screen.go('history'); },
  render(){
    const list=$('h-list'); const logs=Store.all().slice().reverse();
    $('h-clear').style.display = logs.length ? 'block' : 'none';
    if(!logs.length){ list.innerHTML='<div class="h-empty">Chưa có phiên chơi nào.<br>Hãy chơi một ván để lưu điểm nhé! 🎮</div>'; return; }
    list.innerHTML = logs.map(l=>{
      const d=new Date(l.date);
      const when=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const name = l.modeName || (l.level===2 ? 'Bảng cửu chương' : 'Cộng & Trừ');
      const badge = l.badge || (l.group==='mul' || l.level===2 ? '✖️' : '➕');
      const reason = l.reason==='completed' ? 'Hoàn thành' : (l.reason==='quit' ? 'Đã thoát' : 'Hết giờ');
      const cls = l.score>0?'pos':(l.score<0?'neg':'zero');
      const sign = l.score>0?'+':'';
      const secs = l.time ? ` · ${l.time}s/câu` : '';
      return `<div class="h-item">
        <div class="h-badge">${badge}</div>
        <div class="h-mid">
          <div class="h-when">${when}</div>
          <div class="h-sub">${name}${secs} · Đúng ${l.correct}/${l.answered} · ${reason}</div>
        </div>
        <div class="h-score ${cls}">${sign}${l.score}</div>
      </div>`;
    }).join('');
  },
  clear(){ if(confirm('Xóa toàn bộ lịch sử điểm? Không thể khôi phục.')){ Store.clear(); this.render(); } }
};

/* Nút Back của Android */
window.addEventListener('load', ()=>{ Home.refresh(); history.pushState({},''); });
window.addEventListener('popstate', ()=>{
  history.pushState({},'');
  const cur=document.querySelector('.screen.on').id;
  if(cur==='screen-game'){ Game.confirmQuit(); }
  else if(cur!=='screen-home'){ Screen.go('home'); }
});
</script>
