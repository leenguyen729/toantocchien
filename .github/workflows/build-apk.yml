name: Build APK

# Chay khi ban bam nut (Actions -> Build APK -> Run workflow), hoac khi push
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai goi SDK can thiet
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Build APK (debug - cai truc tiep duoc)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tai APK len (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ToanTocChien-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
